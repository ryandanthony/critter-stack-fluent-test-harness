mode: ContinuousDelivery
tag-prefix: v
# No Mainline strategy: on main every commit since the last v tag shares the next version, so
# docs/chore commits don't burn patch numbers. Release tags v{MajorMinorPatch} (ADR-0017).
strategies:
  - TaggedCommit

assembly-versioning-scheme: MajorMinor
assembly-file-versioning-scheme: MajorMinorPatch
assembly-informational-format: '{SemVer}+{ShortSha}'

# Breaking changes are marked with "type!:" in the subject. A "BREAKING CHANGE:" footer alone is not
# picked up by GitVersion 6.8 (tested), so it would ship as a patch.
major-version-bump-message: '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\(.*\))?!:.*'
minor-version-bump-message: '^feat(\(.*\))?:.*'
patch-version-bump-message: '^fix(\(.*\))?:.*'
no-bump-message: '^(docs|style|chore|ci|build|test|refactor)(\(.*\))?:.*'

branches:
  main:
    regex: ^main$
    mode: ContinuousDelivery
    label: ''
    increment: Patch
    prevent-increment:
      of-merged-branch: true
    track-merge-target: false
    is-release-branch: true
    is-main-branch: true
  feature:
    regex: ^(feature|feat)[/-]
    mode: ContinuousDelivery
    label: '{BranchName}'
    increment: Inherit
  spec:
    regex: ^\d{3}-
    mode: ContinuousDelivery
    label: alpha
    increment: Inherit
    source-branches:
      - main
  pull-request:
    regex: ^(pull|pull\-request|pr)[/-]
    mode: ContinuousDelivery
    label: pr
    increment: Inherit
