name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Docs site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      # onBrokenLinks/onBrokenAnchors/onBrokenMarkdownLinks are all set to 'throw' in
      # docusaurus.config.ts, so this build fails on any broken internal link or anchor.
      - name: Build
        working-directory: website
        run: npm run build

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  # Runs once GitHub Pages is enabled (Settings > Pages > Source: GitHub Actions) and the repo variable
  # PAGES_ENABLED is set to true. Until then the build job still checks every docs change. See ADR-0015.
  deploy:
    if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
